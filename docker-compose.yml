services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      # Optional: fresh clones without a `.env` still start with the
      # `environment` defaults below; copy `.env.example` to `.env`
      # to override (required for a real AUTH_SECRET).
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://despensa:despensa@postgres:5432/despensa?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: despensa
      POSTGRES_PASSWORD: despensa
      POSTGRES_DB: despensa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despensa -d despensa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
